<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Canvas</title>

  <style>
    body {
      background-color: white;
    }

    canvas {
      border: 1px solid black;
    }
  </style>
</head>

<body>

  <h1>Luke Deane</h1>

  <canvas id="canvas-for-ball"></canvas>

  <script>

    var canvas = document.getElementById("canvas-for-ball");
    var ctx = canvas.getContext("2d");


    class Ball {

      constructor(xpos, ypos, xSpeed, ySpeed, r) {
        this.xpos = xpos;
        this.ypos = ypos;
        this.xSpeed = xSpeed;
        this.ySpeed = ySpeed;
        this.r = r;
      }


      move() {

        this.xpos = this.xpos + this.xSpeed;
        this.ypos = this.ypos + this.ySpeed;

        // Bounce off the left and right sides.
        if (this.xpos >= canvas.width - this.r) {
          this.xSpeed = -this.xSpeed;
        }

        else if (this.xpos <= this.r) {
          this.xSpeed = -this.xSpeed;
        }


        // Bounce off the top and bottom.
        if (this.ypos >= canvas.height - this.r) {
          this.ySpeed = -this.ySpeed;
        }

        else if (this.ypos <= this.r) {
          this.ySpeed = -this.ySpeed;
        }

      }


      draw() {

        ctx.beginPath();
        ctx.arc(this.xpos, this.ypos, this.r, 0, 2 * Math.PI);
        ctx.stroke();

      }


      resize(newRadius) {

        this.r = newRadius;

      }

    }


    class Paddle {

      constructor(xpos, ypos, width, height) {
        this.xpos = xpos;
        this.ypos = ypos;
        this.width = width;
        this.height = height;
      }


      draw() {

        ctx.fillRect(
          this.xpos,
          this.ypos,
          this.width,
          this.height
        );

      }


      move(xSpeed, ySpeed) {

        this.xpos = this.xpos + xSpeed;
        this.ypos = this.ypos + ySpeed;

        // Stop the paddle going above the canvas.
        if (this.ypos < 0) {
          this.ypos = 0;
        }

        // Stop the paddle going below the canvas.
        if (this.ypos + this.height > canvas.height) {
          this.ypos = canvas.height - this.height;
        }

      }


      moveToMouse(mouseY) {

        this.ypos = mouseY - (this.height / 2);

        // Stop the paddle going above the canvas.
        if (this.ypos < 0) {
          this.ypos = 0;
        }

        // Stop the paddle going below the canvas.
        if (this.ypos + this.height > canvas.height) {
          this.ypos = canvas.height - this.height;
        }

      }

    }


    // Create the ball.
    var ball = new Ball(50, 10, 2, 1, 3);


    // Create the first paddle on the left.
    var paddle1 = new Paddle(20, 50, 10, 50);


    // Create the second paddle on the right.
    var paddle2 = new Paddle(canvas.width - 30, 50, 10, 50);


    // Keyboard control variables for paddle 1.
    var upPressed = false;
    var downPressed = false;


    // Keyboard control variables for paddle 2.
    var wPressed = false;
    var sPressed = false;


    // Detect keyboard keys being pressed.
    window.addEventListener("keydown", function(event) {

      // Paddle 1 - Up and Down arrows.
      if (event.key === "ArrowUp") {
        upPressed = true;
        event.preventDefault();
      }

      if (event.key === "ArrowDown") {
        downPressed = true;
        event.preventDefault();
      }


      // Paddle 2 - W and S.
      if (event.key.toLowerCase() === "w") {
        wPressed = true;
      }

      if (event.key.toLowerCase() === "s") {
        sPressed = true;
      }

    });


    // Detect keyboard keys being released.
    window.addEventListener("keyup", function(event) {

      // Paddle 1 - Up and Down arrows.
      if (event.key === "ArrowUp") {
        upPressed = false;
      }

      if (event.key === "ArrowDown") {
        downPressed = false;
      }


      // Paddle 2 - W and S.
      if (event.key.toLowerCase() === "w") {
        wPressed = false;
      }

      if (event.key.toLowerCase() === "s") {
        sPressed = false;
      }

    });


    // Move paddle 1 to the mouse Y-coordinate.
    canvas.addEventListener("mousemove", function(event) {

      var rect = canvas.getBoundingClientRect();

      var mouseY = event.clientY - rect.top;

      paddle1.moveToMouse(mouseY);

    });


    function repeatme() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);


      // Move paddle 1 with the keyboard.
      if (upPressed) {
        paddle1.move(0, -5);
      }

      if (downPressed) {
        paddle1.move(0, 5);
      }


      // Move paddle 2 with W and S.
      if (wPressed) {
        paddle2.move(0, -5);
      }

      if (sPressed) {
        paddle2.move(0, 5);
      }


      // Draw and move the ball.
      ball.draw();
      ball.move();


      // Draw both paddles.
      paddle1.draw();
      paddle2.draw();


      window.requestAnimationFrame(repeatme);

    }


    repeatme();

  </script>

</body>

</html>
