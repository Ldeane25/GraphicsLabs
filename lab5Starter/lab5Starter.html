
<!DOCTYPE html>
<html>
<head>
    <!--Import Three.js CDN-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <meta charset="UTF-8">
    <title>luke deane</title>

    <style type="text/css">
    </style>
</head>

<body>

    <h1>Luke Deane</h1>

    <script type="text/javascript">

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 5;

        // Create sphere geometry
        var geometry = new THREE.SphereGeometry(1, 32, 32);

        // Create sphere material with wireframe disabled
        var material = new THREE.MeshLambertMaterial({
            color: 0x00ff00,
            wireframe: false
        });

        // Create sphere using geometry and material
        var sphere = new THREE.Mesh(geometry, material);

        // Add sphere to the scene
        scene.add(sphere);

        // Add a white spotlight to illuminate the sphere
        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Set the sphere's horizontal movement speed
        var moveSpeed = 0.02;

        // Set the direction of movement
        var direction = 1;

        // Animation loop to rotate and move the sphere
        function repeatMe() {

            // Request the next animation frame
            requestAnimationFrame(repeatMe);

            // Rotate sphere on X and Y axes
            sphere.rotation.x += 0.01;
            sphere.rotation.y += 0.01;

            // Move sphere horizontally
            sphere.position.x += moveSpeed * direction;

            // Reverse direction when sphere reaches the boundaries
            if (sphere.position.x >= 2 || sphere.position.x <= -2) {
                direction *= -1;
            }

            // Render the updated scene
            renderer.render(scene, camera);
        }

        // Start the animation loop
        repeatMe();

    </script>

</body>
</html>
