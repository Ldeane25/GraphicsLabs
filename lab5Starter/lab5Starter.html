
<!DOCTYPE html>
<html>
<head>
    <!--Import Three.js CDN-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <meta charset="UTF-8">
    <title>luke deane</title>

    <style type="text/css">
    </style>
</head>

<body>

    <h1>Luke Deane</h1>

    <script type="text/javascript">

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Set camera position
        camera.position.z = 5;

        // Sphere class to manage geometry, material and movement
        class Sphere {

            constructor() {

                // Create sphere geometry
                this.geometry = new THREE.SphereGeometry(1, 32, 32);

                // Create sphere material with wireframe disabled
                this.material = new THREE.MeshLambertMaterial({
                    color: 0x00ff00,
                    wireframe: false
                });

                // Create sphere using geometry and material
                this.mesh = new THREE.Mesh(this.geometry, this.material);

                // Set horizontal movement speed
                this.moveSpeed = 0.02;

                // Set initial movement direction
                this.direction = 1;

                // Add sphere to the scene
                scene.add(this.mesh);
            }

            // Rotate the sphere on X and Y axes
            rotate() {

                this.mesh.rotation.x += 0.01;
                this.mesh.rotation.y += 0.01;

            }

            // Move sphere horizontally
            move() {

                this.mesh.position.x += this.moveSpeed * this.direction;

                // Reverse direction at the boundaries
                if (this.mesh.position.x >= 2 || this.mesh.position.x <= -2) {
                    this.direction *= -1;
                }

            }

            // Update sphere movement and rotation
            update() {

                this.rotate();
                this.move();

            }

        }

        // Create a sphere object
        var sphere = new Sphere();

        // Add a white spotlight to illuminate the sphere
        var spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(1, 0.5, 1);
        scene.add(spotLight);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Animation loop to update the sphere
        function repeatMe() {

            // Request the next animation frame
            requestAnimationFrame(repeatMe);

            // Update sphere rotation and movement
            sphere.update();

            // Render the updated scene
            renderer.render(scene, camera);
        }

        // Start the animation loop
        repeatMe();

    </script>

</body>
</html>
