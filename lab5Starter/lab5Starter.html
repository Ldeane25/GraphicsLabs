
<!DOCTYPE html>
<html>
<head>
    <!--Import Three.js CDN-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <meta charset="UTF-8">
    <title>luke deane</title>

    <style type="text/css">
    </style>
</head>

<body>

    <h1>Luke Deane</h1>

    <script type="text/javascript">

        // Implement scene - Create a Three.js scene to hold objects.
        var scene = new THREE.Scene();

        // Create a camera with specified properties.
        var camera = new THREE.PerspectiveCamera(
            80,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        // Set camera position
        camera.position.set(0, 3, 8);
        camera.lookAt(0, 0, 0);

        // Sphere class to manage geometry, material and movement
        class Sphere {

            constructor(color, startX, direction) {

                // Create sphere geometry
                this.geometry = new THREE.SphereGeometry(1, 32, 32);

                // Create sphere material
                this.material = new THREE.MeshLambertMaterial({
                    color: color,
                    wireframe: false
                });

                // Create sphere using geometry and material
                this.mesh = new THREE.Mesh(this.geometry, this.material);

                // Set starting position above the plane
                this.mesh.position.set(startX, 2, 0);

                // Allow sphere to cast shadows
                this.mesh.castShadow = true;

                // Set sphere radius for collision detection
                this.radius = 1;

                // Set horizontal movement speed
                this.moveSpeed = 0.02;

                // Set initial movement direction
                this.direction = direction;

                // Set vertical movement speed
                this.velocityY = 0;

                // Set gravity
                this.gravity = -0.005;

                // Set bounce strength
                this.bounceStrength = 0.15;

                // Add sphere to the scene
                scene.add(this.mesh);
            }

            // Rotate sphere on X and Y axes
            rotate() {

                this.mesh.rotation.x += 0.01;
                this.mesh.rotation.y += 0.01;

            }

            // Move sphere horizontally
            move() {

                this.mesh.position.x += this.moveSpeed * this.direction;

                // Reverse direction at the boundaries
                if (this.mesh.position.x >= 2.5) {

                    this.mesh.position.x = 2.5;
                    this.direction = -1;

                }

                if (this.mesh.position.x <= -2.5) {

                    this.mesh.position.x = -2.5;
                    this.direction = 1;

                }

            }

            // Make sphere fall and bounce off the plane
            bounce() {

                // Apply gravity to vertical speed
                this.velocityY += this.gravity;

                // Update vertical position
                this.mesh.position.y += this.velocityY;

                // Check if sphere has touched the plane
                if (this.mesh.position.y <= this.radius) {

                    // Keep sphere above the plane
                    this.mesh.position.y = this.radius;

                    // Bounce sphere upwards
                    this.velocityY = this.bounceStrength;

                }

            }

            // Update sphere movement, rotation and bouncing
            update() {

                this.rotate();
                this.move();
                this.bounce();

            }

        }

        // Create the first green sphere
        var sphere1 = new Sphere(0x00ff00, -2.5, 1);

        // Create the second blue sphere
        var sphere2 = new Sphere(0x0000ff, 2.5, -1);

        // Detect collisions between the two spheres
        function checkCollision() {

            // Calculate distance between sphere centres
            var distance = sphere1.mesh.position.distanceTo(
                sphere2.mesh.position
            );

            // Calculate minimum distance before collision
            var minimumDistance = sphere1.radius + sphere2.radius;

            // Check if spheres are touching
            if (distance < minimumDistance) {

                // Calculate collision direction
                var collisionDirection = new THREE.Vector3();

                collisionDirection.subVectors(
                    sphere2.mesh.position,
                    sphere1.mesh.position
                );

                // Avoid dividing by zero
                if (collisionDirection.lengthSq() === 0) {
                    collisionDirection.set(1, 0, 0);
                }

                collisionDirection.normalize();

                // Separate overlapping spheres
                var overlap = minimumDistance - distance;

                sphere1.mesh.position.addScaledVector(
                    collisionDirection,
                    -overlap / 2
                );

                sphere2.mesh.position.addScaledVector(
                    collisionDirection,
                    overlap / 2
                );

                // Make spheres move away from each other
                sphere1.direction = -1;
                sphere2.direction = 1;

                // Make both spheres bounce upwards
                sphere1.velocityY = sphere1.bounceStrength;
                sphere2.velocityY = sphere2.bounceStrength;

            }

        }

        // Create a flat plane below the spheres
        var planeGeometry = new THREE.PlaneGeometry(12, 8);

        // Create plane material that reacts to light
        var planeMaterial = new THREE.MeshLambertMaterial({
            color: 0x888888,
            side: THREE.DoubleSide
        });

        // Create plane mesh
        var plane = new THREE.Mesh(planeGeometry, planeMaterial);

        // Rotate plane so it lies horizontally
        plane.rotation.x = -Math.PI / 2;

        // Position plane below the spheres
        plane.position.y = 0;

        // Allow plane to receive shadows
        plane.receiveShadow = true;

        // Add plane to the scene
        scene.add(plane);

        // Add a white spotlight to illuminate the spheres
        var spotLight = new THREE.SpotLight(0xffffff, 1.5);

        // Position spotlight above the spheres and plane
        spotLight.position.set(1, 6, 4);

        // Point spotlight towards the centre
        spotLight.target.position.set(0, 0, 0);
        scene.add(spotLight.target);

        // Enable shadows from spotlight
        spotLight.castShadow = true;

        // Adjust spotlight angle
        spotLight.angle = Math.PI / 4;

        // Set shadow quality
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;

        // Add spotlight to the scene
        scene.add(spotLight);

        // Add camera helper to display spotlight shadow camera
        var cameraHelper = new THREE.CameraHelper(
            spotLight.shadow.camera
        );
        scene.add(cameraHelper);

        // Implement renderer - Create a WebGL renderer for rendering the scene.
        var renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        // Set renderer size
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Enable shadow rendering
        renderer.shadowMap.enabled = true;

        // Set shadow rendering type
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Add renderer canvas to the page
        document.body.appendChild(renderer.domElement);

        // Animation loop to update both spheres
        function repeatMe() {

            // Request the next animation frame
            requestAnimationFrame(repeatMe);

            // Update both spheres
            sphere1.update();
            sphere2.update();

            // Check for collision between spheres
            checkCollision();

            // Render the updated scene
            renderer.render(scene, camera);

        }

        // Start the animation loop
        repeatMe();

    </script>

</body>
</html>
