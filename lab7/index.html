<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v7.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title>D3 CO2 Lab - Luke Deane</title>
</head>

<body>
    <h1>Luke Deane</h1>

    <script>
        // Download the CO2 data
        d3.json("https://raw.githubusercontent.com/humphs078/programming_for_data_analysis_assignment_2/refs/heads/main/datasets/fused_datasets/json/long_term_fused_data.json")
            .then(function(data) {
                console.log(data);
                plotCO2Data(data);
            })
            .catch(function(error) {
                console.log("Error loading CO2 data:", error);
            });

        function plotCO2Data(data) {
            // SVG size
            const svgWidth = 900;
            const svgHeight = 500;

            // Space around the graph for labels and axes
            const margin = {
                top: 50,
                right: 30,
                bottom: 60,
                left: 80
            };

            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            // Convert years ago into horizontal positions
            const xScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.years_before_2023;
                }))
                .range([0, width]);

            // Convert CO2 values into vertical positions
            const yScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.co2_ppmv;
                }))
                .nice()
                .range([height, 0]);

            // Create the axes with integer tick labels
            const xAxis = d3.axisBottom(xScale)
                .ticks(10)
                .tickFormat(d3.format("d"));

            const yAxis = d3.axisLeft(yScale)
                .ticks(8)
                .tickFormat(d3.format("d"));

            // Set up the line coordinates
            const line = d3.line()
                .x(function(d) {
                    return xScale(d.years_before_2023);
                })
                .y(function(d) {
                    return yScale(d.co2_ppmv);
                });

            // Add the SVG to the page
            const svg = d3.select("body")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .style("font-family", "Arial, sans-serif");

            // Move the chart group inside the margins
            const chart = svg.append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Place the x-axis at the bottom
            chart.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis)
                .style("font-size", "14px");

            // Place the y-axis on the left
            chart.append("g")
                .call(yAxis)
                .style("font-size", "14px");

            // Draw the CO2 line
            chart.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "red")
                .attr("stroke-width", 2)
                .attr("d", line);

            // Chart title
            chart.append("text")
                .attr("x", width / 2)
                .attr("y", -20)
                .attr("text-anchor", "middle")
                .style("font-size", "22px")
                .style("font-weight", "bold")
                .text("Atmospheric CO₂ Over Time");

            // X-axis label
            chart.append("text")
                .attr("x", width / 2)
                .attr("y", height + 45)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .text("Years ago (relative to 2023)");

            // Y-axis label
            chart.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -55)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .text("CO₂ (ppm)");
        }
    </script>
</body>

</html>
