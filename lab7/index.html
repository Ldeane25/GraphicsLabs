<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v7.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title>D3 CO2 Lab - Luke Deane</title>
</head>

<body>
    <h1>Luke Deane</h1>

    <script>
        // Download the data
        d3.json("https://raw.githubusercontent.com/humphs078/programming_for_data_analysis_assignment_2/refs/heads/main/datasets/fused_datasets/json/long_term_fused_data.json")
            .then(function(data) {
                console.log(data);
                plotCO2Data(data);
            })
            .catch(function(error) {
                console.log("Error loading CO2 data:", error);
            });

        function plotCO2Data(data) {
            // SVG size
            const svgWidth = 1100;
            const svgHeight = 550;

            // Extra space for the legend and right-hand axes
            const margin = {
                top: 80,
                right: 230,
                bottom: 60,
                left: 80
            };

            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            // Shared time scale
            const xScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.years_before_2023;
                }))
                .range([0, width]);

            // CO2 scale
            const yScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.co2_ppmv;
                }))
                .nice()
                .range([height, 0]);

            // Temperature scale
            const temperatureScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.temp_anomaly;
                }))
                .nice()
                .range([height, 0]);

            // Methane scale
            const methaneScale = d3.scaleLinear()
                .domain(d3.extent(data, function(d) {
                    return d.ch4_ppb;
                }))
                .nice()
                .range([height, 0]);

            // Create the axes
            const xAxis = d3.axisBottom(xScale)
                .ticks(10)
                .tickFormat(d3.format("d"));

            const yAxis = d3.axisLeft(yScale)
                .ticks(8)
                .tickFormat(d3.format("d"));

            const temperatureAxis = d3.axisRight(temperatureScale)
                .ticks(8);

            const methaneAxis = d3.axisRight(methaneScale)
                .ticks(8)
                .tickFormat(d3.format("d"));

            // CO2 line
            const line = d3.line()
                .x(function(d) {
                    return xScale(d.years_before_2023);
                })
                .y(function(d) {
                    return yScale(d.co2_ppmv);
                });

            // Temperature line
            const temperatureLine = d3.line()
                .x(function(d) {
                    return xScale(d.years_before_2023);
                })
                .y(function(d) {
                    return temperatureScale(d.temp_anomaly);
                });

            // Methane line
            const methaneLine = d3.line()
                .x(function(d) {
                    return xScale(d.years_before_2023);
                })
                .y(function(d) {
                    return methaneScale(d.ch4_ppb);
                });

            // Add the SVG
            const svg = d3.select("body")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .style("font-family", "Arial, sans-serif");

            // Keep zoomed lines inside the chart area
            svg.append("defs")
                .append("clipPath")
                .attr("id", "chart-clip")
                .append("rect")
                .attr("width", width)
                .attr("height", height);

            const chart = svg.append("g")
                .attr("transform",
                    "translate(" + margin.left + "," + margin.top + ")");

            // Bottom time axis
            const xAxisGroup = chart.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis)
                .style("font-size", "14px");

            // Left CO2 axis
            chart.append("g")
                .call(yAxis)
                .style("font-size", "14px")
                .style("color", "red");

            // Right temperature axis
            chart.append("g")
                .attr("transform", "translate(" + width + ",0)")
                .call(temperatureAxis)
                .style("font-size", "14px")
                .style("color", "blue");

            // Methane axis further to the right
            chart.append("g")
                .attr("transform", "translate(" + (width + 110) + ",0)")
                .call(methaneAxis)
                .style("font-size", "14px")
                .style("color", "green");

            // Group for the clipped lines
            const lines = chart.append("g")
                .attr("clip-path", "url(#chart-clip)");

            // Draw CO2
            const co2Path = lines.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "red")
                .attr("stroke-width", 2)
                .attr("d", line);

            // Draw temperature
            const temperaturePath = lines.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "blue")
                .attr("stroke-width", 2)
                .attr("d", temperatureLine);

            // Draw methane
            const methanePath = lines.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "green")
                .attr("stroke-width", 2)
                .attr("d", methaneLine);

            // Chart title
            chart.append("text")
                .attr("x", width / 2)
                .attr("y", -50)
                .attr("text-anchor", "middle")
                .style("font-size", "22px")
                .style("font-weight", "bold")
                .text("CO₂, Temperature and Methane Over Time");

            // Legend
            const legendData = [
                { label: "CO₂", color: "red" },
                { label: "Temperature anomaly", color: "blue" },
                { label: "Methane", color: "green" }
            ];

            const legend = chart.append("g")
                .attr("transform", "translate(0,-25)");

            legendData.forEach(function(item, index) {
                const entry = legend.append("g")
                    .attr("transform",
                        "translate(" + (index * 250) + ",0)");

                entry.append("line")
                    .attr("x1", 0)
                    .attr("x2", 25)
                    .attr("y1", 0)
                    .attr("y2", 0)
                    .attr("stroke", item.color)
                    .attr("stroke-width", 2);

                entry.append("text")
                    .attr("x", 35)
                    .attr("y", 5)
                    .style("font-size", "14px")
                    .text(item.label);
            });

            // X-axis label
            chart.append("text")
                .attr("x", width / 2)
                .attr("y", height + 45)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .text("Years ago (relative to 2023)");

            // CO2 axis label
            chart.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -55)
                .attr("text-anchor", "middle")
                .attr("fill", "red")
                .style("font-size", "16px")
                .text("CO₂ (ppm)");

            // Temperature axis label
            chart.append("text")
                .attr("transform",
                    "translate(" + (width + 65) + "," +
                    (height / 2) + ") rotate(-90)")
                .attr("text-anchor", "middle")
                .attr("fill", "blue")
                .style("font-size", "16px")
                .text("Temperature anomaly (°C)");

            // Methane axis label
            chart.append("text")
                .attr("transform",
                    "translate(" + (width + 195) + "," +
                    (height / 2) + ") rotate(-90)")
                .attr("text-anchor", "middle")
                .attr("fill", "green")
                .style("font-size", "16px")
                .text("Methane (ppb)");

            // Set zoom limits and keep dragging inside the data range
            const zoom = d3.zoom()
                .scaleExtent([1, 20])
                .extent([[0, 0], [width, height]])
                .translateExtent([[0, 0], [width, height]])
                .on("zoom", zoomed);

            // Transparent area captures mouse actions
            chart.append("rect")
                .attr("width", width)
                .attr("height", height)
                .attr("fill", "none")
                .attr("pointer-events", "all")
                .style("cursor", "move")
                .call(zoom);

            function zoomed(event) {
                // Change only the horizontal scale
                const zoomedX = event.transform.rescaleX(xScale);

                xAxisGroup.call(xAxis.scale(zoomedX));

                // Update x positions while keeping y positions fixed
                line.x(function(d) {
                    return zoomedX(d.years_before_2023);
                });

                temperatureLine.x(function(d) {
                    return zoomedX(d.years_before_2023);
                });

                methaneLine.x(function(d) {
                    return zoomedX(d.years_before_2023);
                });

                co2Path.attr("d", line);
                temperaturePath.attr("d", temperatureLine);
                methanePath.attr("d", methaneLine);
            }
        }
    </script>
</body>

</html>
